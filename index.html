<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="championships.css">

    <title>Mi Wrestling</title>
</head>

<body>

<header class="navbar">

    <a href="index.html" class="logo">
        <img src="images/logo.png" alt="MI WRESTLING">
    </a>

    <nav id="mainNav">

        <a href="index.html">Roster</a>
        <a href="inactive.html">Alumni</a>
        <a href="History/index.html">History</a>
        <a href="inactive.html">Shop</a>
        <a href="inactive.html">Recaps</a>
        <a href="inactive.html">Games</a>
        <a href="inactive.html">Guide</a>
        <a href="inactive.html">About</a>
        <a href="inactive.html">Watch</a>

    </nav>

    <button class="menu" id="menuButton">☰</button>

</header>


<!-- =========================================
     CHAMPIONSHIPS
     ========================================= -->

<section class="championships-section">

    <h1>CHAMPIONS</h1>

    <div class="championships" id="championships"></div>

</section>


<!-- =========================================
     ROSTERS
     ========================================= -->

<main data-roster-status="active">

    <!-- =========================================
         MAIN ROSTER
         ========================================= -->

    <section class="roster-section">

        <div class="roster-divider">
            <h1>MAIN ROSTER</h1>
        </div>

        <div class="roster" id="roster"></div>

    </section>


    <!-- =========================================
         NXT ROSTER
         ========================================= -->

    <section class="roster-section nxt-section">

        <div class="roster-divider">
            <h1>NXT ROSTER</h1>
        </div>

        <div class="roster" id="nxt-roster"></div>

    </section>

</main>


<!-- =========================================
     MODAL
     ========================================= -->

<div id="modal" class="modal">

    <div
        class="modal-content"
        onclick="event.stopPropagation()"
    >

        <button
            class="close-button"
            onclick="closeModal()"
        >
            ×
        </button>

        <h3>CAREER ACCOMPLISHMENTS</h3>

        <h2 id="modal-name"></h2>

        <p id="modal-division"></p>

        <ul id="modal-achievements"></ul>

    </div>

</div>


<!-- =========================================
     JAVASCRIPT
     ========================================= -->

<script src="js/wrestlers.js"></script>
<script src="js/modal.js"></script>
<script src="js/roster.js"></script>
<script src="js/championships.js"></script>
<script src="History/menu.js"></script>
    
</body>

</html>
