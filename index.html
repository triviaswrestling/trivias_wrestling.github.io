<!DOCTYPE html>
<html lang="es">

<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mi Wrestling</title>

    <style>
        body {
            margin: 0;
            background: #111;
            color: white;
            font-family: Arial, sans-serif;
        }

        header {
            background: #000;
            padding: 20px;
            text-align: center;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 10px;
        }

        main {
            padding: 30px 15px;
            text-align: center;
        }

        h1 {
            font-size: 42px;
        }

        .roster {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            max-width: 1000px;
            margin: auto;
        }

        .wrestler {
            background: #222;
            border-radius: 8px;
            overflow: hidden;
            cursor: pointer;
        }

        .wrestler img {
            width: 100%;
            display: block;
        }

        .wrestler h2 {
            margin: 10px 5px 3px;
        }

        .wrestler p {
            margin: 0 5px 15px;
            color: #aaa;
        }

        @media (min-width: 700px) {
            .roster {
                grid-template-columns: repeat(4, 1fr);
            }
        }
    </style>
</head>

<body>

<header>

    <h2>MI WRESTLING</h2>

    <nav>
