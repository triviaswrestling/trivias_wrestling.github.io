<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Trivias Wrestling</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header>

    <h2>TRIVIAS WRESTLING</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">Roster</a>
        <a href="#">Events</a>
        <a href="#">Championships</a>
    </nav>

</header>

<main>

    <h1>ACTIVE ROSTER</h1>

    <div class="roster">

        <!-- Cody Rhodes -->

        <div class="wrestler" onclick="openModal(0)">

            <img src="images/Cody Rhodes trivias.jpg" alt="Cody Rhodes">

            <p>"The American Nightmare"</p>

            <h2>Cody Rhodes</h2>

        </div>

    </div>

</main>


<!-- WRESTLER MODAL -->

<div id="modal" class="modal">

    <div class="modal-content">

        <button class="close-button" onclick="closeModal()">✕</button>

        <img id="modal-image" src="" alt="Wrestler">

        <h2 id="modal-name"></h2>

        <p id="modal-division"></p>

        <p id="modal-record"></p>

        <h3>Achievements</h3>

        <ul id="modal-achievements"></ul>

    </div>

</div>


<script src="script.js"></script>

</body>

</html>
