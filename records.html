<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MI WRESTLING - Records</title>

    <link
        rel="stylesheet"
        href="records.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
         ========================================= -->

    <header>

        <a
            href="index.html"
            class="back-button"
        >
            ← BACK TO ROSTER
        </a>

    </header>


    <!-- =========================================
         MAIN
         ========================================= -->

    <main>


        <!-- =====================================
             TITLE
             ===================================== -->

        <section class="records-header">

            <div class="section-label">
                MI WRESTLING
            </div>

            <h1>
                WRESTLER RECORDS
            </h1>

            <p>
                COMPLETE RECORDS & STATISTICS
            </p>

        </section>


        <!-- =====================================
             SEARCH
             ===================================== -->

        <section class="records-search">

    <input
        type="text"
        id="record-search"
        placeholder="SEARCH WRESTLER..."
    >

    <div class="record-filters">

        <button class="record-filter active" data-brand="ALL">
            ALL
        </button>

        <button class="record-filter" data-brand="RAW">
            RAW
        </button>

        <button class="record-filter" data-brand="SMACKDOWN">
            SMACKDOWN
        </button>

        <button class="record-filter" data-brand="NXT">
            NXT
        </button>

    </div>

    <div class="record-pages">

        <button class="record-page active" data-page="1">
            PART 1
        </button>

        <button class="record-page" data-page="2">
            PART 2
        </button>

        <button class="record-page" data-page="3">
            PART 3
        </button>

        <button class="record-page" data-page="4">
            PART 4
        </button>

        <button class="record-page" data-page="5">
            PART 5
        </button>

    </div>

</section>


        <!-- =====================================
             RECORDS
             ===================================== -->

        <section id="records-container">

        </section>


    </main>


    <script src="js/records.js"></script>

</body>

</html>
