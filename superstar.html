<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>MI WRESTLING - Superstar</title>

    <link
        rel="stylesheet"
        href="superstar.css"
    >

</head>


<body>


    <!-- =========================================
         HEADER
         ========================================= -->

    <header>

        <a
            href="records.html"
            class="back-button"
        >
            ← BACK TO RECORDS
        </a>

    </header>


    <!-- =========================================
         MAIN
         ========================================= -->

    <main>


        <!-- =====================================
             SUPERSTAR HEADER
             ===================================== -->

        <section class="superstar-header">

            <div class="superstar-photo">

                <img
                    id="superstar-image"
                    src="images/Vacante.jpg"
                    alt="Superstar"
                >

            </div>


            <div class="superstar-info">

                <div class="section-label">
                    MI WRESTLING
                </div>

                <h1 id="superstar-name">
                    LOADING...
                </h1>

                <p id="superstar-nickname">
                </p>

                <p id="superstar-brand">
                </p>

            </div>

        </section>


        <!-- =====================================
             OVERALL RECORD
             ===================================== -->

        <section class="superstar-section">

            <h2>
                OVERALL RECORD
            </h2>


            <div class="stats-grid">

                <div class="stat-box">

                    <span>
                        WINS
                    </span>

                    <strong id="wins">
                        0
                    </strong>

                </div>


                <div class="stat-box">

                    <span>
                        LOSSES
                    </span>

                    <strong id="losses">
                        0
                    </strong>

                </div>


                <div class="stat-box">

                    <span>
                        DRAWS
                    </span>

                    <strong id="draws">
                        0
                    </strong>

                </div>

            </div>

        </section>


        <!-- =====================================
             MATCH RECORD
             ===================================== -->

        <section class="superstar-section">

            <h2>
                MATCH RECORD
            </h2>


            <div class="match-record">

                <div class="match-record-row">

                    <span>
                        SINGLES
                    </span>

                    <strong id="singles-record">
                        0 - 0 - 0
                    </strong>

                </div>


                <div class="match-record-row">

                    <span>
                        TAG TEAM
                    </span>

                    <strong id="tag-record">
                        0 - 0 - 0
                    </strong>

                </div>


                <div class="match-record-row">

                    <span>
                        6-MAN TAG TEAM
                    </span>

                    <strong id="six-man-record">
                        0 - 0 - 0
                    </strong>

                </div>

            </div>

        </section>


        <!-- =====================================
             CHAMPIONSHIPS
             ===================================== -->

        <section class="superstar-section">

            <h2>
                CHAMPIONSHIPS
            </h2>


            <div
                id="championships"
                class="championships"
            >

                <p>
                    NO CHAMPIONSHIPS
                </p>

            </div>

        </section>


        <!-- =====================================
             MATCH HISTORY
             ===================================== -->

        <section class="superstar-section">

            <h2>
                MATCH HISTORY
            </h2>


            <div
                id="match-history"
                class="match-history"
            >

                <p>
                    NO MATCHES
                </p>

            </div>

        </section>


    </main>


        <script src="js/wrestlers.js"></script>
    <script src="js/superstar.js"></script>
</body>
</html>
