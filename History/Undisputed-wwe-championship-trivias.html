<body>

<header class="navbar">

    <a href="../index.html" class="logo">

<!-- =========================================
     CAMPEONATO HERO
     ========================================= -->

<section class="campeonato-hero">

    <div class="campeonato-hero-content">

        <p>CHAMPIONSHIP HISTORY</p>

        <h1>
            UNDISPUTED WWE<br>
            CHAMPIONSHIP
        </h1>

        <div class="hero-line"></div>

    </div>

</section>


<!-- =========================================
     INFORMACIÓN DEL CAMPEONATO
     ========================================= -->

<main class="campeonato-container">

    <section class="campeonato-intro">

        <div class="campeonato-image">

            <img
                src="wwwi.jpg"
                alt="Undisputed WWE Championship"
            >

        </div>


        <div class="campeonato-info">

            <span class="info-label">
                CURRENT CHAMPION
            </span>

            <h2>
                VACANT
            </h2>

            <p>
                Championship History
            </p>

        </div>

    </section>


    <!-- =========================================
         HISTORIA DE CAMPEONES
         ========================================= -->

    <section class="campeones-history">

        <div class="section-title">

            <span>TITLE HISTORY</span>

            <h2>CHAMPIONS</h2>

        </div>


        <!-- =====================================
             CAMPEÓN #1
             ===================================== -->

        <article class="campeon-entry">

            <div class="campeon-number">
                01
            </div>


            <div class="campeon-photo">

                <img
                    src="../images/Vacante.jpg"
                    alt="Christian"
                >

            </div>


            <div class="campeon-info">

                <span class="reign-number">
                    REIGN #1
                </span>

                <h3>
                    CHRISTIAN
                </h3>

                <p>
                    First Champion
                </p>


                <div class="reign-data">

                    <span>WON</span>

                    <strong>
                        JANUARY 1, 2026
                    </strong>

                </div>


                <div class="reign-data">

                    <span>REIGN</span>

                    <strong>
                        0 DAYS
                    </strong>

                </div>

            </div>

        </article>

    </section>

</main>
